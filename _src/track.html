    <section class="track-head">
      <div class="stripes" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="wrap">
        <p class="kicker">{{side}} · Track {{tno}}</p>
        <h1>{{title}}</h1>
        <p class="lede">{{summary}}</p>
      </div>
    </section>

    <section class="track-body">
      <div class="wrap track-grid">
        <div class="code-col">
          <div class="code-bar">
            <span>{{file}} · {{lines}} lines</span>
            <span class="code-actions">
              <button type="button" class="copy" data-copy="code">Copy</button>
              <a href="examples/{{file}}" download>Download</a>
            </span>
          </div>
          <pre class="code" id="code" tabindex="0"><code>{{code}}</code></pre>
        </div>
        <aside class="out-col">
          <h2>Expected output</h2>
          <pre class="output" tabindex="0">{{output}}</pre>
          <p class="note">Written by hand from the code, not machine-run on this site. Run it yourself:<br /><code>groovy {{file}}</code></p>
        </aside>
      </div>
      <nav class="wrap pager" aria-label="Tracks">{{prev}}{{next}}</nav>
    </section>
